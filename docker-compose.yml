services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - model-cache:/root/.cache/huggingface
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  model-cache: